<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olvidé mi contraseña</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 380px; }
        h1 { color: #2c3e50; margin-bottom: 8px; font-size: 24px; }
        p { color: #888; margin-bottom: 24px; font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
        button:hover { background-color: #34495e; }
        .links { margin-top: 16px; text-align: center; font-size: 13px; }
        .links a { color: #2c3e50; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .error { color: #e74c3c; font-size: 13px; margin-bottom: 12px; display: none; }
        .success { color: #27ae60; font-size: 13px; margin-bottom: 12px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Recuperar contraseña</h1>
        <p>Te enviaremos un enlace a tu email</p>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
        <label>Email</label>
        <input type="email" id="email" placeholder="Tu email">
        <button onclick="forgotPassword()">Enviar enlace</button>
        <div class="links">
            <a href="login.html">Volver al login</a>
        </div>
    </div>

    <script>
        async function forgotPassword() {
            const email = document.getElementById("email").value;
            const errorDiv = document.getElementById("error");
            const successDiv = document.getElementById("success");

            const response = await fetch("http://127.0.0.1:8000/forgot-password", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({email})
            });

            const data = await response.json();

            if (data.message) {
                errorDiv.style.display = "none";
                successDiv.style.display = "block";
                successDiv.textContent = "Email enviado, revisa tu bandeja de entrada.";
            } else {
                successDiv.style.display = "none";
                errorDiv.style.display = "block";
                errorDiv.textContent = data.error;
            }
        }
    </script>
</body>
</html>
